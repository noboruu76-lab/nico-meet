# NICO Meet — coturn (TURN/STUN) 設定
# 直接P2Pが張れない回線（企業網・対称NAT）でだけメディアを中継する保険。
#
# ↓ 3か所を自分の環境に書き換えてから使う（<> は消す）
#   YOUR_REALM       : ドメイン（例 turn.example.com）
#   YOUR_SECRET      : signalingの TURN_SECRET と“完全に同じ”文字列
#   YOUR_PUBLIC_IP   : このVPSのグローバルIP
# ------------------------------------------------------------------

# --- 認証：時限クレデンシャル方式（signalingが同じsecretで発行）---
use-auth-secret
static-auth-secret=YOUR_SECRET
realm=YOUR_REALM

# --- 待ち受け ---
listening-port=3478
# TLS(turns:)を使うなら証明書を用意して以下を有効化（任意）
# tls-listening-port=5349
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem

# --- 公開IP（クラウドVMはNAT内なので明示が必須）---
# 「内部IP/外部IP」形式でも可。単一グローバルIPならそのまま。
external-ip=YOUR_PUBLIC_IP

# --- リレー用UDPポート範囲（ファイアウォールでこの範囲を開ける）---
min-port=49160
max-port=49200

# --- セキュリティ（中継の悪用・内部ネットワーク探索を防ぐ）---
fingerprint
no-multicast-peers
no-cli
# 内部/予約アドレスへの中継を拒否（SSRF的な踏み台化を防ぐ）
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- ログ ---
log-file=stdout
simple-log
